[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letrasiq"
version = "0.1.0"
description = "Local font-design toolkit operated through Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LetrasIQ contributors" }]
dependencies = [
  "typer>=0.12",
  "fonttools>=4.53",
  "fontmake>=3.9",
  "ufoLib2>=0.16",
  "skia-pathops>=0.8",
  "Pillow>=10.0",
  "brotli>=1.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
letrasiq = "letrasiq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["letrasiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel.force-include]
"letrasiq/data" = "letrasiq/data"