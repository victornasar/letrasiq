<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__FAMILY__ Tester</title>
<style>
/* Layout: a plain workbench. Controls sit above one stack of specimens, and the test fonts are the only expressive type on the page. */
@font-face { font-family: "TestFont"; src: url(data:font/woff2;base64,__FONT__) format("woff2"); font-display: block; }
:root {
  --bg: #eef0f2; --fg: #1b2026; --muted: #5a6470; --line: #cdd3d9; --control: #ffffff; --accent: #1f5fbf; --accent-fg: #ffffff;
  --miss-bg: #fbdcd6; --miss-fg: #a3271a;
  --paper-light: #ffffff; --ink-light: #14171a; --paper-dark: #14171a; --ink-dark: #eceff2;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1a1e23; --fg: #e6e9ec; --muted: #9aa4af; --line: #39414a; --control: #262b31; --accent: #7fb0f5; --accent-fg: #10151b;
  --miss-bg: #4a221d; --miss-fg: #ffb4a8; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--ui); }
main { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 4px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
h2 { font: 600 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 68ch; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
output { font: 12px var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type=range] { width: 150px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--control); color: var(--fg); font: 13px var(--ui); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }
select, input[type=text], textarea { background: var(--control); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 13px var(--ui); padding: 6px 8px; max-width: 100%; }
textarea { width: 100%; min-height: 66px; resize: vertical; font-size: 15px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); font: 12px var(--ui); padding: 4px 9px; cursor: pointer; }
.note { font-size: 12px; color: var(--miss-fg); min-height: 17px; }
.surface { background: var(--paper-light); color: var(--ink-light); border: 1px solid var(--line); border-radius: 4px; }
.surface[data-bg=dark] { background: var(--paper-dark); color: var(--ink-dark); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.compare-on .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cell { padding: 18px 20px; min-width: 0; display: grid; gap: 8px; align-content: start; }
.compare-on .cell + .cell { border-left: 1px solid var(--line); }
.cap { font: 11px var(--mono); opacity: .55; }
.spec { white-space: pre-wrap; overflow-wrap: anywhere; }
.para .spec { max-width: 62ch; }
.miss { background: var(--miss-bg); color: var(--miss-fg); font-family: var(--mono); font-size: .62em; font-weight: 600; padding: 0 .25em; border-radius: 2px; vertical-align: .12em; letter-spacing: 0; }
.wf-row { border-top: 1px solid var(--line); }
.wf-row:first-child { border-top: 0; }
.wf-row .cell { padding-block: 10px; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 1px; padding: 1px; }
.char { aspect-ratio: 1; display: grid; place-items: center; font-size: 30px; }
.char.absent { background: var(--miss-bg); color: var(--miss-fg); font: 600 13px var(--mono); }
@media (max-width: 720px) {
  .compare-on .pair { grid-template-columns: minmax(0, 1fr); }
  .compare-on .cell + .cell { border-left: 0; border-top: 1px solid var(--line); }
  input[type=range] { width: 120px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>__FAMILY__ Tester</h1>
    <p>Generated by <code>letrasiq build</code>. Any character the font doesn't have yet is marked in red.</p>
  </header>

  <section aria-label="Controls">
    <div class="controls">
      <div class="field"><label for="size">Size <output id="sizeOut"></output></label><input id="size" type="range" min="12" max="200" value="72"></div>
      <div class="field"><label for="lh">Line height <output id="lhOut"></output></label><input id="lh" type="range" min="0.9" max="2" step="0.05" value="1.2"></div>
      <div class="field"><label for="tr">Tracking <output id="trOut"></output></label><input id="tr" type="range" min="-50" max="150" step="5" value="0"></div>
      <div class="field"><span class="label">Background</span>
        <div class="seg" id="bgSeg"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      </div>
      <div class="field"><label for="cmp">Compare with</label>
        <select id="cmp"><option value="">Nothing</option><option>Helvetica</option><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option value="__custom">Other font</option></select>
      </div>
      <div class="field" id="customWrap" hidden><label for="custom">Font name on this device</label><input id="custom" type="text" value="" placeholder="Palatino"></div>
    </div>
    <div class="note" id="cmpNote" role="status"></div>
  </section>

  <section>
    <h2><label for="text">Your text</label></h2>
    <textarea id="text"></textarea>
    <div class="presets" id="presets"></div>
    <div class="note" id="missNote" role="status"></div>
    <div class="surface js-surface" id="main"></div>
  </section>

  <section>
    <h2>Waterfall</h2>
    <div class="surface js-surface" id="wf"></div>
  </section>

  <section class="para">
    <h2>Paragraph</h2>
    <div class="controls"><div class="field"><label for="pSize">Paragraph size <output id="pSizeOut"></output></label><input id="pSize" type="range" min="12" max="28" value="18"></div></div>
    <div class="surface js-surface" id="para"></div>
  </section>

  <section>
    <h2 id="charsTitle">Character set</h2>
    <div class="surface js-surface chars" id="chars"></div>
  </section>
</main>
<script>
const HAVE = new Set(__CHARS__);
const SAMPLES = __SAMPLES__;
const READING = SAMPLES.Reading;
const WATERFALL = [12, 14, 16, 18, 20, 24, 32, 48, 72, 96];
const $ = (id) => document.getElementById(id);
const FAMILY = __FAMILY_JSON__;
const state = { font: "TestFont", bg: "light", cmp: "" };

function fill(el, text, marked) {
  el.textContent = "";
  if (!marked) { el.textContent = text; return; }
  let run = "";
  const flush = () => { if (run) { el.append(run); run = ""; } };
  for (const ch of text) {
    if (HAVE.has(ch) || ch === "\n") { run += ch; continue; }
    flush();
    const m = document.createElement("span");
    m.className = "miss"; m.textContent = ch; m.title = "Not drawn yet";
    el.append(m);
  }
  flush();
}
function styleSpec(el, family, size) {
  el.style.fontFamily = `"${family}", serif`;
  el.style.fontSize = size + "px";
  el.style.lineHeight = $("lh").value;
  el.style.letterSpacing = (+$("tr").value / 1000) + "em";
}
function cell(text, family, size, marked, caption) {
  const c = document.createElement("div"); c.className = "cell";
  if (caption) { const k = document.createElement("div"); k.className = "cap"; k.textContent = caption; c.append(k); }
  const s = document.createElement("div"); s.className = "spec";
  styleSpec(s, family, size); fill(s, text, marked); c.append(s);
  return c;
}
function pair(text, size, caption) {
  const p = document.createElement("div"); p.className = "pair";
  const cmp = state.cmp;
  const label = (n) => caption ? `${caption} ${n}` : n;
  p.append(cell(text, state.font, size, true, cmp ? label(FAMILY) : caption));
  if (cmp) p.append(cell(text, cmp, size, false, label(cmp)));
  return p;
}
function fontAvailable(name) {
  const c = document.createElement("canvas").getContext("2d");
  const probe = "mmmmmmmmlliWWooHH";
  return ["monospace", "serif", "sans-serif"].some((base) => {
    c.font = `72px ${base}`; const a = c.measureText(probe).width;
    c.font = `72px "${name}", ${base}`; const b = c.measureText(probe).width;
    return a !== b;
  });
}
function render() {
  const text = $("text").value;
  const size = +$("size").value;
  $("sizeOut").textContent = size + " px";
  $("lhOut").textContent = (+$("lh").value).toFixed(2);
  $("trOut").textContent = $("tr").value;
  $("pSizeOut").textContent = $("pSize").value + " px";
  const missing = new Set([...text].filter((c) => !HAVE.has(c) && c !== "\n"));
  $("missNote").textContent = missing.size ? `Not drawn yet: ${[...missing].join(" ")}` : "";
  $("cmpNote").textContent = state.cmp && !fontAvailable(state.cmp)
    ? `${state.cmp} isn't installed here, so the comparison is showing a fallback font. Choose another.` : "";
  document.querySelectorAll(".js-surface").forEach((s) => {
    s.dataset.bg = state.bg;
    s.classList.toggle("compare-on", !!state.cmp);
  });
  $("main").replaceChildren(pair(text, size));
  const line = text.split("\n")[0].slice(0, 60) || "Hamburgefonstiv";
  $("wf").replaceChildren(...WATERFALL.map((px) => {
    const r = pair(line, px, px + " px"); r.classList.add("wf-row"); return r;
  }));
  $("para").replaceChildren(pair(READING, +$("pSize").value));
  const chars = [];
  let count = 0;
  for (let i = 32; i < 127; i++) {
    const ch = String.fromCharCode(i);
    const d = document.createElement("div");
    const drawn = HAVE.has(ch);
    if (drawn) count++;
    d.className = "char" + (drawn ? "" : " absent");
    d.textContent = ch === " " ? "␠" : ch;
    d.title = drawn ? "Drawn" : "Not drawn yet";
    if (drawn && ch !== " ") d.style.fontFamily = `"${state.font}", serif`;
    if (ch === " ") d.style.font = "13px var(--mono)";
    chars.push(d);
  }
  $("chars").replaceChildren(...chars);
  $("charsTitle").textContent = `Basic Latin: ${count} of 95 printable ASCII characters drawn`;
}
function seg(id, key) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v;
    [...$(id).children].forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
}
seg("bgSeg", "bg");
for (const [name, value] of Object.entries(SAMPLES)) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = name;
  b.addEventListener("click", () => { $("text").value = value.trim(); render(); });
  $("presets").append(b);
}
["text", "size", "lh", "tr", "pSize"].forEach((id) => $(id).addEventListener("input", render));
function syncCompare() {
  const v = $("cmp").value;
  $("customWrap").hidden = v !== "__custom";
  state.cmp = v === "__custom" ? $("custom").value.trim().replace(/["\\]/g, "") : v;
  render();
}
$("cmp").addEventListener("change", syncCompare);
$("custom").addEventListener("input", syncCompare);
$("text").value = Object.values(SAMPLES)[0];
if (window.innerWidth < 720) $("size").value = 40;
render();
document.fonts.ready.then(render);
</script>
</body>
</html>
